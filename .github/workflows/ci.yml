name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  quality-gates:
    name: Quality Gates
    uses: ./.github/workflows/quality-gates.yml

  security-scans:
    name: Security Scans
    uses: ./.github/workflows/security-scans.yml

  baseline-report:
    name: Baseline Report
    needs: [quality-gates, security-scans]
    if: always()
    uses: ./.github/workflows/baseline-report.yml
    with:
      secret_scan_result: ${{ needs.quality-gates.outputs.secret_scan_result }}
      coverage_result: ${{ needs.quality-gates.outputs.coverage_result }}
      dependency_audit_result: ${{ needs.security-scans.outputs.dependency_audit_result }}
      sast_result: ${{ needs.security-scans.outputs.sast_result }}
    secrets: inherit

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [quality-gates, security-scans]
    if: always()
    steps:
      - name: Check all quality and security jobs passed
        run: |
          failed=0

          if [[ "${{ needs.quality-gates.result }}" != "success" ]]; then
            echo "Quality gates failed"
            failed=1
          fi

          if [[ "${{ needs.security-scans.result }}" != "success" ]]; then
            echo "Security scans failed"
            failed=1
          fi

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo "All quality and security gates passed"
